[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# O Vue Router usa history mode. Sem esta regra, abrir ou atualizar uma rota
# interna (ex.: /projetos/1) retornaria 404 na hospedagem estática.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
